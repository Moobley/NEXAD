name: Deploy to Aruba (Production static export)

# Production deployment to Aruba hosting via FTPS.
#
# Manual ONLY — the go-live has not been explicitly approved yet. This
# workflow runs exclusively on workflow_dispatch, never on push. The GitHub
# Pages preview workflow (.github/workflows/deploy.yml) is untouched and
# remains the automatic preview environment.
#
# Only the contents of the `out/` static export are uploaded: no sources,
# .git, node_modules, .env or development config files can reach the server.
#
# dry_run defaults to TRUE (preview): the action still connects to the server
# and reads its own remote `.ftp-deploy-sync-state.json` to compute the diff,
# but performs no upload/replace/delete and never publishes the state file.
# Untick the input only for a real production publish.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes only (no upload/replace/delete on the server)"
        type: boolean
        default: true
        required: false

permissions:
  contents: read

# Never let two manual production runs race against the same hosting space.
concurrency:
  group: aruba-production
  cancel-in-progress: false

env:
  # Static-export settings for the production (Aruba) build. Production is
  # served from the canonical origin with an empty basePath.
  #
  # NEXT_PUBLIC_* values come from GitHub repository *variables*. Missing or
  # empty variables resolve to "" and the code is fail-closed:
  #   - NEXT_PUBLIC_SITE_INDEXABLE !== "true"            -> noindex, follow
  #   - NEXT_PUBLIC_CONTACT_FORM_ENABLED !== "true", or no Formspree ID
  #                                                       -> form stays disabled
  #   - lib/seo.ts additionally rejects any indexable build unless the origin
  #     is exactly https://www.nexadlab.com with an empty basePath.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_ORIGIN: https://www.nexadlab.com
  NEXT_PUBLIC_SITE_INDEXABLE: ${{ vars.NEXT_PUBLIC_SITE_INDEXABLE }}
  NEXT_PUBLIC_CONTACT_FORM_ENABLED: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENABLED }}
  NEXT_PUBLIC_FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Aruba configuration (fail-closed)
        shell: bash
        env:
          ARUBA_SERVER: ${{ vars.ARUBA_FTP_SERVER }}
          ARUBA_USERNAME: ${{ secrets.ARUBA_FTP_USERNAME }}
          ARUBA_PASSWORD: ${{ secrets.ARUBA_FTP_PASSWORD }}
          SITE_INDEXABLE: ${{ vars.NEXT_PUBLIC_SITE_INDEXABLE }}
          CONTACT_FORM_ENABLED: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENABLED }}
          FORMSPREE_FORM_ID: ${{ vars.NEXT_PUBLIC_FORMSPREE_FORM_ID }}
        run: |
          set -euo pipefail
          : "${ARUBA_SERVER:?ARUBA_FTP_SERVER (variable) is required}"
          : "${ARUBA_USERNAME:?ARUBA_FTP_USERNAME (secret) is required}"
          : "${ARUBA_PASSWORD:?ARUBA_FTP_PASSWORD (secret) is required}"
          # NEXT_PUBLIC_SITE_INDEXABLE: only the exact value "true" enables
          # indexing; anything else (missing, empty, any other value) keeps the
          # build noindex (fail-closed).
          if [ "${SITE_INDEXABLE:-}" = "true" ]; then
            echo "NEXT_PUBLIC_SITE_INDEXABLE=true -> indexable production build"
          else
            echo "NEXT_PUBLIC_SITE_INDEXABLE not exactly \"true\" (got: '${SITE_INDEXABLE:-<unset>}') -> build stays noindex (fail-closed)"
          fi
          # NEXT_PUBLIC_CONTACT_FORM_ENABLED: only the exact value "true" AND a
          # Formspree ID enable the form. Enabled without an ID FAILS now.
          if [ "${CONTACT_FORM_ENABLED:-}" = "true" ]; then
            if [ -z "${FORMSPREE_FORM_ID:-}" ]; then
              echo "NEXT_PUBLIC_CONTACT_FORM_ENABLED=true requires NEXT_PUBLIC_FORMSPREE_FORM_ID (fail-closed)" >&2
              exit 1
            fi
            echo "NEXT_PUBLIC_CONTACT_FORM_ENABLED=true with Formspree ID -> form enabled"
          else
            echo "NEXT_PUBLIC_CONTACT_FORM_ENABLED not exactly \"true\" (got: '${CONTACT_FORM_ENABLED:-<unset>}') -> form stays disabled (fail-closed)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build production static export
        run: npm run build

      - name: Verify static export exists
        run: |
          test -d out
          test -f out/index.html

      - name: Verify static SEO output (fail-closed)
        run: npm run verify:seo

      - name: Publish out/ to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0 (SHA-pinned, Node 24)
        with:
          server: ${{ vars.ARUBA_FTP_SERVER }}
          username: ${{ secrets.ARUBA_FTP_USERNAME }}
          password: ${{ secrets.ARUBA_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./out/
          server-dir: www.nexadlab.com/
          dry-run: ${{ inputs.dry_run }}
          # dangerous-clean-slate is deliberately NOT set (default false): this
          # workflow never deletes anything already present on the hosting
          # space. It only uploads/overwrites the files in out/.